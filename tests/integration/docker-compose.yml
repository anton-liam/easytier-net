# EasyTier Gateway Integration Lab
#
# Product-path topology:
#   A/B: OpenWrt rootfs + easytier-core -w only; Web later sends peer_urls=[C]
#   C:   easytier-web config-server/API + local EasyTier relay listener
#   D:   client behind A
#   internet: service reachable only from B's WAN side
#
# Docker keeps A/B/C/D on one lab underlay for Desktop compatibility, but
# the policy still flows through Web REST -> WebClient RPC -> gateway_policy.

networks:
  underlay:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24
  lan_a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.2.0/24
  internet_b:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.3.0/24

services:
  # ── A: Source Gateway ──
  node-a:
    image: ghcr.io/openwrt/rootfs:armsr-armv8
    entrypoint: ["/entrypoint.sh"]
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 10.99.1.10
      lan_a:
        ipv4_address: 10.99.2.254
    environment:
      - ROLE=source
      - WAN_IFACE=eth1
      - LAN_IFACE=eth0
      - DEFAULT_GW=10.99.1.1
      - CONFIG_SERVER=udp://10.99.1.4:22020/admin
      - MACHINE_ID=00000000-0000-0000-0000-00000000000a
      - NODE_HOSTNAME=node-a
      - BOOTSTRAP_NETWORK=0
    volumes:
      - ./images/entrypoint-openwrt.sh:/entrypoint.sh:ro
      - ../../dist/aarch64/easytier-core:/usr/bin/easytier-core:ro
    depends_on:
      - web

  # ── B: Exit Gateway ──
  node-b:
    image: ghcr.io/openwrt/rootfs:armsr-armv8
    entrypoint: ["/entrypoint.sh"]
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 10.99.1.3
      internet_b:
        ipv4_address: 10.99.3.3
    environment:
      - ROLE=exit
      - DEVICE_TEMPLATE=singleport
      - CONFIG_SERVER=udp://10.99.1.4:22020/admin
      - MACHINE_ID=00000000-0000-0000-0000-00000000000b
      - NODE_HOSTNAME=node-b
      - BOOTSTRAP_NETWORK=0
    volumes:
      - ./images/entrypoint-openwrt.sh:/entrypoint.sh:ro
      - ../../dist/aarch64/easytier-core:/usr/bin/easytier-core:ro
    depends_on:
      - web

  # ── C: Control Plane ──
  web:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: web
    networks:
      underlay:
        ipv4_address: 10.99.1.4
    ports:
      - "11211:11211"
    environment:
      - ROLE=web
      - RELAY_MACHINE_ID=00000000-0000-0000-0000-00000000000c
      - RELAY_HOSTNAME=node-c
      - RELAY_NETWORK_NAME=gateway-docker
      - RELAY_NETWORK_SECRET=gateway-docker-secret
      - RELAY_LISTENER=tcp://0.0.0.0:11010
    volumes:
      - ../../dist/aarch64/easytier-web:/opt/easytier/easytier-web:ro
      - ../../dist/aarch64/easytier-core:/opt/easytier/easytier-core:ro

  # ── D: Client behind A ──
  client-d:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: client-d
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      lan_a:
        ipv4_address: 10.99.2.100
    environment:
      - ROLE=client
      - CLIENT_DEFAULT_GW=10.99.2.254
      - CLIENT_IPV4=10.99.2.100/24
    depends_on:
      - node-a

  # ── Deterministic Internet endpoint reachable from B's WAN side. ──
  internet:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: internet
    command:
      - sh
      - -c
      - |
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Length: 3\r\n\r\nok\n' | nc -l -p 8080
        done
    networks:
      internet_b:
        ipv4_address: 10.99.3.200
