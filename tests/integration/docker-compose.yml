# EasyTier Gateway Integration Lab
#
# IMPORTANT: 在真实部署中，A/B/C 处于三个不同物理网络（不同地域/运营商）。
# 它们通过 EasyTier 组网互达，A/B 之间不一定有直接物理连通。
# Docker 测试中用 underlay 网络简化模拟，但设计上不能假设 A/B 同一局域网。
#
# Hardware simulation:
#   A = NanoPi R3S (dualport, iStoreOS): WAN(eth0) + LAN(eth1/br-lan)
#   B = RPi4/5 or R3S (singleport, iStoreOS): eth0 only (旁路由出口)
#   C = Ubuntu server (控制面)
#   D = Ubuntu client (A 的子网设备，只能通过 A 出网)
#
# Network relationships:
#   - A 能访问 C (通过 EasyTier 或 underlay)
#   - B 能访问 C (通过 EasyTier 或 underlay)
#   - D 是 A 的子网设备，默认网关指向 A，只能通过 A 出网
#   - A/B 之间通过 EasyTier tunnel 互达
#
# Topology:
#   D --[lan_a: A's LAN port]--> A --[EasyTier tunnel]--> B --[wan_b]--> Internet
#                                         |                    |
#                                         └── C (control) ─────┘
#
# Usage:
#   docker compose up -d
#   docker compose exec client-d ping -c2 8.8.8.8     # after policy applied
#   docker compose down

networks:
  # A(WAN)/B/C physical interconnect — simulates upstream network
  # On real hardware: the network that WAN ports connect to
  underlay:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.64.0/24

  # A's LAN port — D connects here
  # On real R3S: eth1 (br-lan), serves DHCP to downstream clients
  lan_a:
    driver: bridge
    internal: true  # D cannot reach Internet directly, must go through A
    ipam:
      config:
        - subnet: 192.168.1.0/24

  # B's exit to Internet (Docker bridge with NAT)
  # On real hardware: B's WAN port connects to ISP/upstream with public IP
  wan_b:
    driver: bridge

services:
  # ── A: Source Gateway ──
  # Simulates: NanoPi R3S (dualport) running iStoreOS
  # eth0 = WAN (接入上游网络, EasyTier 通过此口组网连接 C)
  # eth1 = LAN (br-lan, D 作为子网设备连接此口, 通过 A 出网)
  node-a:
    build:
      context: .
      dockerfile: images/Dockerfile.istoreos
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 192.168.64.8   # WAN 口 IP
      lan_a:
        ipv4_address: 192.168.1.1    # LAN 口 IP (br-lan)
    environment:
      - DEVICE_TEMPLATE=dualport
      - ROLE=source
      - WAN_IFACE=eth0
      - LAN_IFACE=eth1
    volumes:
      - ./configs/node-a:/etc/easytier:ro
    depends_on:
      - web

  # ── B: Exit Gateway ──
  # Simulates: RPi4/5 (singleport) or R3S as exit, running iStoreOS
  # 作为旁路由出口节点，与 A 不在同一物理网络
  # eth0 = 唯一网口 (接入 B 所在网络, 通过此口 EasyTier 组网 + 出口到 Internet)
  # No LAN port — only receives tunnel traffic and masquerades out
  node-b:
    build:
      context: .
      dockerfile: images/Dockerfile.istoreos
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 192.168.64.3   # 组网用（连 config-server）
      wan_b: {}                       # 出口到 Internet
    environment:
      - DEVICE_TEMPLATE=singleport
      - ROLE=exit
      - WAN_IFACE=eth0
    volumes:
      - ./configs/node-b:/etc/easytier:ro
    depends_on:
      - web

  # ── C: Control Plane ──
  # Ubuntu server running easytier-web + config-server + relay
  web:
    build:
      context: .
      dockerfile: images/Dockerfile.ubuntu
    hostname: web
    networks:
      underlay:
        ipv4_address: 192.168.64.4
    ports:
      - "11211:11211"
    volumes:
      - ./configs/web:/etc/easytier:ro

  # ── D: Client behind A's LAN ──
  # Ubuntu desktop/laptop connected to A's LAN port
  # Default gateway points to A — all Internet traffic goes through A
  client-d:
    build:
      context: .
      dockerfile: images/Dockerfile.ubuntu
    hostname: client-d
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      lan_a:
        ipv4_address: 192.168.1.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # D's only route to outside is through A's LAN interface
        ip route replace default via 192.168.1.1
        echo "client-d ready, default gw -> 192.168.1.1 (node-a LAN)"
        sleep infinity
    depends_on:
      - node-a
