# EasyTier Gateway Integration Lab
#
# Simplified single-network topology for Docker Desktop compatibility.
# All nodes on one underlay network. D's default gateway points to A.
# Policy routing on A marks D's traffic and forwards to B.
#
# Topology:
#   D (10.99.1.100) --default gw--> A (10.99.1.10) --policy route--> B (10.99.1.3) --> Internet
#                                          |                            |
#                                          └── C (10.99.1.4, control) ──┘
#
# Usage:
#   docker compose up -d
#   make test
#   docker compose down

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24

services:
  # ── A: Source Gateway ──
  node-a:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      labnet:
        ipv4_address: 10.99.1.10
    environment:
      - ROLE=source
    volumes:
      - ./configs/node-a:/etc/easytier:ro
    depends_on:
      - web

  # ── B: Exit Gateway ──
  node-b:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      labnet:
        ipv4_address: 10.99.1.3
    environment:
      - ROLE=exit
    volumes:
      - ./configs/node-b:/etc/easytier:ro
    depends_on:
      - web

  # ── C: Control Plane ──
  web:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: web
    networks:
      labnet:
        ipv4_address: 10.99.1.4
    ports:
      - "11211:11211"
    volumes:
      - ./configs/web:/etc/easytier:ro

  # ── D: Client behind A ──
  client-d:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: client-d
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 10.99.1.100
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # D's default gateway points to A
        ip route replace default via 10.99.1.10
        echo "client-d ready, default gw -> 10.99.1.10 (node-a)"
        sleep infinity
    depends_on:
      - node-a
