# EasyTier Gateway Integration Lab
#
# Topology:
#   D (client) --[lan_a]--> A (source) --[underlay]--> B (exit) --[wan_b]--> Internet
#                                          |
#                                     C (control)
#
# Usage:
#   docker compose up -d
#   docker compose exec client-d ping -c2 8.8.8.8     # after policy applied
#   docker compose down

networks:
  # A/B/C physical interconnect
  underlay:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.64.0/24

  # D connects to A's LAN port
  lan_a:
    driver: bridge
    internal: true  # D cannot reach Internet directly, must go through A
    ipam:
      config:
        - subnet: 192.168.1.0/24

  # B exit to Internet (Docker NAT)
  wan_b:
    driver: bridge

services:
  # ── A: Source Gateway (iStoreOS / OpenWrt) ──
  node-a:
    build:
      context: .
      dockerfile: images/Dockerfile.openwrt
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 192.168.64.8
      lan_a:
        ipv4_address: 192.168.1.1
    volumes:
      - ./configs/node-a:/etc/easytier:ro
    depends_on:
      - web

  # ── B: Exit Gateway (iStoreOS / OpenWrt) ──
  node-b:
    build:
      context: .
      dockerfile: images/Dockerfile.openwrt
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      underlay:
        ipv4_address: 192.168.64.3
      wan_b: {}
    volumes:
      - ./configs/node-b:/etc/easytier:ro
    depends_on:
      - web

  # ── C: Control Plane (Ubuntu) ──
  web:
    build:
      context: .
      dockerfile: images/Dockerfile.ubuntu
    hostname: web
    networks:
      underlay:
        ipv4_address: 192.168.64.4
    ports:
      - "11211:11211"
    volumes:
      - ./configs/web:/etc/easytier:ro

  # ── D: Client behind A ──
  client-d:
    build:
      context: .
      dockerfile: images/Dockerfile.ubuntu
    hostname: client-d
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      lan_a:
        ipv4_address: 192.168.1.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # D's only route to outside is through A
        ip route replace default via 192.168.1.1
        echo "client-d ready, default gw -> 192.168.1.1 (node-a)"
        sleep infinity
    depends_on:
      - node-a
