# EasyTier Gateway Integration Lab
#
# Product-path topology:
#   A/B: OpenWrt rootfs + easytier-core -w
#   C:   easytier-web config-server/API
#   D:   client behind A
#   internet: service reachable only from B's WAN side
#
# Docker keeps A/B/C/D on one lab underlay for Desktop compatibility, but
# the policy still flows through Web REST -> WebClient RPC -> gateway_policy.

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.1.0/24

services:
  # ── A: Source Gateway ──
  node-a:
    image: ghcr.io/openwrt/rootfs:armsr-armv8
    entrypoint: ["/entrypoint.sh"]
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      labnet:
        ipv4_address: 10.99.1.10
    environment:
      - ROLE=source
      - CONFIG_SERVER=udp://10.99.1.4:22020/admin
      - MACHINE_ID=00000000-0000-0000-0000-00000000000a
      - NODE_HOSTNAME=node-a
    volumes:
      - ./images/entrypoint-openwrt.sh:/entrypoint.sh:ro
      - ../../dist/aarch64/easytier-core:/usr/bin/easytier-core:ro
    depends_on:
      - web

  # ── B: Exit Gateway ──
  node-b:
    image: ghcr.io/openwrt/rootfs:armsr-armv8
    entrypoint: ["/entrypoint.sh"]
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      labnet:
        ipv4_address: 10.99.1.3
    environment:
      - ROLE=exit
      - DEVICE_TEMPLATE=singleport
      - CONFIG_SERVER=udp://10.99.1.4:22020/admin
      - MACHINE_ID=00000000-0000-0000-0000-00000000000b
      - NODE_HOSTNAME=node-b
    volumes:
      - ./images/entrypoint-openwrt.sh:/entrypoint.sh:ro
      - ../../dist/aarch64/easytier-core:/usr/bin/easytier-core:ro
    depends_on:
      - web

  # ── C: Control Plane ──
  web:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: web
    networks:
      labnet:
        ipv4_address: 10.99.1.4
    ports:
      - "11211:11211"
    environment:
      - ROLE=web
    volumes:
      - ../../dist/aarch64/easytier-web:/opt/easytier/easytier-web:ro

  # ── D: Client behind A ──
  client-d:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: client-d
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      labnet:
        ipv4_address: 10.99.1.100
    environment:
      - ROLE=client
      - CLIENT_DEFAULT_GW=10.99.1.10
      - CLIENT_IPV4=10.99.1.100/25
    depends_on:
      - node-a

  # ── Deterministic Internet endpoint. D uses /25, so .200 goes via A. ──
  internet:
    build:
      context: images
      dockerfile: Dockerfile.ubuntu
    hostname: internet
    command:
      - sh
      - -c
      - |
        while true; do
          printf 'HTTP/1.1 200 OK\r\nContent-Length: 3\r\n\r\nok\n' | nc -l -p 8080
        done
    networks:
      labnet:
        ipv4_address: 10.99.1.200
